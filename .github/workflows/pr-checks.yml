name: Pull Request Quality Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Check 1: Run Full Backend Test Suite
  # ========================================================
  test-backend:
    name: "🧪 PR Check: Backend Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit Test Suite
        run: |
          cd backend
          cp .env.example .env.testing
          php artisan key:generate --env=testing
          php artisan test --env=testing

  # ========================================================
  # Check 2: Verify Frontend Production Build
  # ========================================================
  build-frontend:
    name: "🎨 PR Check: Frontend Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build Vue App
        run: |
          cd frontend
          npm ci
          npm run build